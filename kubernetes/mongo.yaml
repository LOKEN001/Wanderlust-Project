apiVersion: v1
kind: Deployment
metadata:
    name: mongo-deployment
    labels:
       app: mongo
spec:
     replica: 1
     selector:
        matchLabels:
           app: mongo
     template:
         metadata:
             name: mongo
         spec: 
             containers:
                name: mongo-cont
                image: mongo:latest
                ports:
                  - containerPort: 27017
                volumeMounts:
                  - name: mongoVolume
                    mountPath: /data/db
             volumes:
                - name: mongoVolume
                  persistentVolumeClaim:
                    claimName: pvc        
