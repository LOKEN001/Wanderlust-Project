apiVersion: apps/v1
kind: Deployment
metadata:
    name: redis-deployment
    labels:
       app: redis 
spec:
       replicas: 1
       selector:
          matchLabels:
             app: redis
       template:
          metadata:
            labels:
              app: redis
          spec: 
              containers:
                - name: redis-cont
                  image: redis:latest
                  ports: 
                    - containerPort: 6379
                  volumeMounts:
                    - name: redis-volume
                      mountPath: /data
              volumes:
                 - name: redis-volume
                   persistentVolumeClaim:
                     claimName: pvc
       
